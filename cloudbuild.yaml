# cloudbuild.yaml — OPS360 STAGING
# Runs unit + integration tests against a local PostgreSQL instance,
# then builds and pushes the Docker image only if all tests pass.
# Triggered on: staging branch / staging Cloud Build trigger.

steps:
  # Debug: verify workspace
  - name: 'alpine'
    entrypoint: 'sh'
    args: ['-c', 'ls -la']

  # Single container: install PostgreSQL + Node 20, start Postgres,
  # wait until it accepts connections, then run the full test suite.
  # Both services share localhost so TEST_DATABASE_URL resolves correctly.
  - name: 'ubuntu'
    id: 'test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e

        # ── Install PostgreSQL ──────────────────────────────────────────
        apt-get update -qq
        apt-get install -y -qq postgresql > /dev/null

        # ── Install Node 20 via NodeSource ─────────────────────────────
        apt-get install -y -qq curl ca-certificates > /dev/null
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash - > /dev/null
        apt-get install -y -qq nodejs > /dev/null

        # ── Start PostgreSQL and create test DB ────────────────────────
        service postgresql start
        su postgres -c "createuser --superuser testuser"
        su postgres -c "createdb -O testuser ops360_test"
        su postgres -c "psql -c \"ALTER USER testuser PASSWORD 'testpass';\""

        # ── Wait until PostgreSQL is actually accepting connections ─────
        until pg_isready -h localhost -p 5432 -U testuser; do
          echo "Waiting for PostgreSQL..."
          sleep 1
        done

        # ── Install deps ───────────────────────────────────────────────
        npm install --no-audit --prefer-offline || npm install --no-audit

        # ── Bootstrap test DB schema ────────────────────────────────────
        # NOTE: Production/staging DB migrations are
        # applied manually via:
        #   npm run db:migrate:staging
        #   npm run db:migrate:production
        # Never run drizzle-kit migrate automatically
        # in CI against live databases.
        #
        # drizzle-kit push requires a TTY; use generate→apply instead.
        TEST_DATABASE_URL=postgresql://testuser:testpass@localhost:5432/ops360_test \
          npx drizzle-kit generate --config=drizzle.test.config.ts --name=init 2>/dev/null || true
        for f in src/db/migrations/*.sql; do
          PGPASSWORD=testpass psql -h localhost -p 5432 -U testuser -d ops360_test -f "$f"
        done
        PGPASSWORD=testpass psql -h localhost -p 5432 -U testuser -d ops360_test -f src/test/procedures.sql

        # ── Run tests ──────────────────────────────────────────────────
        npm run test:unit
        npm run test:integration
    env:
      - 'TEST_DATABASE_URL=$_TEST_DB_URL'
      - 'NODE_ENV=test'

  # Build + tag the Docker image only after all tests pass.
  # SHORT_SHA is set by trigger-based builds; falls back to 'manual' for gcloud builds submit.
  
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        _SHA=$${SHORT_SHA:-manual}
        docker build \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_APP_NAME}:$$_SHA \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_APP_NAME}:latest \
          .
    waitFor: ['test']

  # tag-latest is now done inline in build; this is a no-op kept for pipeline compatibility.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'tag-latest'
    entrypoint: 'bash'
    args: ['-c', 'echo "already tagged :latest in build step"']
    waitFor: ['build']

  # Push both :${SHORT_SHA} and :latest tags in one command.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_APP_NAME}'
    waitFor: ['tag-latest']

  # Deploy the freshly-pushed image to Cloud Run staging.
  # SENTRY_DSN is set directly in Cloud Run env vars
  # Never commit DSN to source code
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_APP_NAME}:latest'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--remove-env-vars'
      - 'NEXTAUTH_SECRET,DATABASE_URL,DB_PASSWORD'
      - '--update-env-vars'
      - 'NEXTAUTH_URL=https://ops360-dev.myappterra.com'
      - '--update-secrets=NEXTAUTH_SECRET=NEXTAUTH_SECRET:latest,DATABASE_URL=DATABASE_URL:latest,DB_PASSWORD=DB_PASSWORD:latest'
      - '--add-cloudsql-instances'
      - 'ops360-production-491911:asia-south1:ops360-db'
      - '--quiet'
    waitFor: ['push']

substitutions:
  _REGION: 'asia-south1'
  _REPO_NAME: 'ops360-repo'
  _APP_NAME: 'ops360-app'
  _SERVICE_NAME: 'ops360-erp-staging'
  _TEST_DB_URL: 'postgresql://testuser:testpass@localhost:5432/ops360_test'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'


