# cloudbuild.yaml: OPS360 Ethan-Home-Appliances
# Standard GCP build config for Next.js Standalone
# Using substitutions for build-time environment variables

steps:
  # Debug Step: Verify workspace context
  - name: 'alpine'
    entrypoint: 'sh'
    args: ['-c', 'ls -la']
    
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_APP_NAME}:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}'
      - '.'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_APP_NAME}:latest'

substitutions:
  _REGION: 'asia-south1'
  _REPO_NAME: 'ops360-repo'
  _APP_NAME: 'ops360-app'
  _SUPABASE_URL: ''
  _SUPABASE_ANON_KEY: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
